<!DOCTYPE html>
<html lang="pt-BR">
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco SENAI - Simulador de Empréstimo</title>
</head>

<body>

    <div class="container" id="appContainer">
        <h2>Simulador de Empréstimo - Banco SENAI</h2>

        <form id="loanForm">
            <div class="form-group">
                <label for="clientName">Nome Completo (Mín. 5 caracteres):</label>
                <input type="text" id="clientName" required>
            </div>

            <div class="form-group">
                <label for="birthDate">Data de Nascimento:</label>
                <input type="date" id="birthDate" required>
            </div>

            <div class="form-group">
                <label for="clientCPF">CPF (Apenas 11 números):</label>
                <input type="text" id="clientCPF" required>

            </div>

            <div class="form-group">
                <label for="loanAmount">Valor do Empréstimo (R$):</label>
                <input type="number" id="loanAmount" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="interestRate">Taxa de Juros Simples (%):</label>
                <input type="number" id="interestRate" step="0.1" required>
            </div>

            <div class="form-group">
                <label for="installments">Quantidade de Parcelas:</label>
                <input type="number" id="installments">
            </div>

            <button type="submit" class="btn btn-primary" id="btnCalculate"
                onclick="ValidationNome()">Calcular
                Empréstimo</button>
        </form>

        <div class="result-box" id="resultBox">
            <h3>Resumo da Simulação</h3>
            <p><strong>Idade Calculada:</strong> <span id="resAge"></span> anos</p>
            <p><strong>Montante Total com Juros:</strong> R$ <span id="resTotalAmount"></span></p>



            <button class="btn btn-danger" id="btnReset" style="margin-top: 20px;">Nova Simulação</button>
        </div>
    </div>

    <script>

        const nome = document.getElementById("clientName").value
        const cpf = document.getElementById("clientCPF").value

        function ValidationNome(params) {
            const tentativa = 0
            if (nome < 4) {
                alert("Nome Inválido!!")
                if (tentativa > 3) {
                    
                }
            }
        }

        function ValidationCPF(params) {
            if (cpf < 10) {
                alert("CPF Inválido!!")
            }
        }

        // Todo o código JavaScript orientado a objetos deve ser implementado aqui ou em um arquivo separado.
        // Lembre-se de criar classes para gerenciar o Cliente, a Simulação e os limites de tentativas (máx 3).
    </script>

    <style>
        * {
            font-family: Arial, sans-serif, cursive;
        }

        body {
            margin: 0;
            background-color: white;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #1565c0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: black;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #467cb3;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
            transition: 1s;
            transform: translateY(-5px);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
            border: black solid 1px;
        }

        .result-box h3 {
            color: #1565c0;
        }
    </style>

</body>

</html>
